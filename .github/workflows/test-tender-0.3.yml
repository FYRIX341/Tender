name: Tender QA Checks
on:
  push:
    branches: [tender-0.3-private-beta, tender-0.3.2-discord-polish, tender-0.3.3-replies-profiles-invites, tender-0.3.4-settings-stability, tender-0.3.5-account-dock-mentions, tender-0.4-communities-and-profiles, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check JavaScript and chat regressions
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check tender-sw.js
          node --check emoji-data.js
      - name: Run Tender regression tests
        run: node --test tests/tender-0.3.test.cjs tests/tender-0.3.2.test.cjs tests/tender-0.3.3.test.cjs tests/tender-0.3.4.test.cjs tests/tender-0.3.5.test.cjs tests/tender-0.4.test.cjs
      - name: Package private beta for desktop testing
        uses: actions/upload-artifact@v4
        with:
          name: Tender-0.4-qa
          path: |
            index.html
            styles.css
            app.js
            emoji-data.js
            config.js
            buffalo.webp
            tender-sw.js
          retention-days: 14
          if-no-files-found: error
