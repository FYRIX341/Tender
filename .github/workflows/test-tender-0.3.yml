name: Tender 0.3 Private Beta Checks
on:
  push:
    branches: [tender-0.3-private-beta]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check JavaScript and chat regressions
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
      - name: Run Tender regression tests
        run: node --test tests/tender-0.3.test.cjs
