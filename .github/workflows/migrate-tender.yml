name: Run Tender 0.2 Migration

# Manual-only. Uses the Supabase HTTPS Management API (not an IPv6 PostgreSQL connection).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tender-production-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Tender 0.2 over Supabase HTTPS API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout existing SQL migration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Supabase migration via HTTPS (no database connection URL)
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +x
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          project_ref = "svrculrtxjudkcljhutn"
          token = os.getenv("SUPABASE_ACCESS_TOKEN", "").strip()
          sql_path = pathlib.Path("migration_0_2.sql")

          if not token:
              print("::error::Missing SUPABASE_ACCESS_TOKEN. Create a scoped token at supabase.com/dashboard/account/tokens with Database Read & Write access to your Tender project; save it privately in GitHub Actions Secrets as SUPABASE_ACCESS_TOKEN.")
              sys.exit(1)
          if not token.startswith("sbp_"):
              print("::error::This must be a Supabase PERSONAL ACCESS TOKEN (sbp_...), not the publishable key, database password, or PostgreSQL URL.")
              sys.exit(1)
          if not sql_path.is_file():
              print("::error::migration_0_2.sql was not found; no SQL was run.")
              sys.exit(1)
          sql = sql_path.read_text(encoding="utf-8")
          if not sql.strip().startswith("-- Tender 0.2") or "BEGIN;" not in sql or "COMMIT;" not in sql:
              print("::error::The Tender 0.2 migration is missing expected transaction guards; refusing to run.")
              sys.exit(1)

          endpoint = f"https://api.supabase.com/v1/projects/{project_ref}/database/query"
          def run_query(statement, read_only=False):
              body = json.dumps({"query": statement, "read_only": read_only}).encode("utf-8")
              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "User-Agent": "Tender-GitHub-Migration/0.2",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      response_body = response.read(65536).decode("utf-8", "replace")
                      if response.status not in (200, 201, 204):
                          raise RuntimeError(f"Unexpected HTTP {response.status}")
              except urllib.error.HTTPError as err:
                  response_body = err.read(2048).decode("utf-8", "replace")
                  # Never print a token if the provider reflects an Authorization value.
                  response_body = response_body.replace(token, "[REDACTED]")
                  print(f"::error::Supabase Management API returned HTTP {err.code}.")
                  if err.code == 401:
                      print("::error::Token is invalid or expired; check the SUPABASE_ACCESS_TOKEN secret.")
                  elif err.code == 403:
                      print("::error::Token needs Database -> Read & Write for this Tender project, or your Supabase account lacks permission.")
                  elif err.code == 404:
                      print("::error::Database query API is unavailable for this project/account. No IPv6 database connection was attempted.")
                  else:
                      print("::error::API error detail (no credential): " + response_body[:1500])
                  sys.exit(1)
              except (urllib.error.URLError, TimeoutError) as err:
                  print("::error::Supabase HTTPS request failed or timed out; do not rerun blindly because a timeout may occur after the query starts.")
                  sys.exit(1)
              try:
                  parsed = json.loads(response_body) if response_body.strip() else None
              except json.JSONDecodeError:
                  parsed = None
              if isinstance(parsed, dict) and parsed.get("error"):
                  print("::error::Supabase reported SQL/API error (no credentials printed): " + str(parsed["error"])[:1500].replace(token, "[REDACTED]"))
                  sys.exit(1)
              return parsed

          # Preflight checks token and project without modifying data.
          run_query("SELECT 1 AS tender_connection_check;", read_only=True)
          print("Supabase HTTPS API authenticated to Tender. Applying the unchanged 0.2 migration...")
          run_query(sql, read_only=False)
          print("Tender 0.2 SQL migration request succeeded. Check the app and SQL tables to verify the resulting changes.")
          PY
